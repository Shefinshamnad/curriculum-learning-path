<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Learning Path Builder</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-primary text-white py-4 mb-4">
        <div class="container">
            <h1 class="mb-1">Learning Path Builder</h1>

            <p class="mb-0">
                Build your personalized learning journey.
            </p>
        </div>
    </header>

    <main class="container pb-5">

        <!-- Alert messages -->
        <div id="alert-container"></div>

        <div class="row g-4">

            <!-- Available Modules -->
            <div class="col-md-6">

                <h2 class="h4 mb-3">
                    Available Modules
                </h2>

                <div id="modules-container">
                    <div class="text-center py-4">
                        <div
                            class="spinner-border text-primary"
                            role="status"
                        >
                            <span class="visually-hidden">
                                Loading...
                            </span>
                        </div>

                        <p class="text-muted mt-2">
                            Loading modules...
                        </p>
                    </div>
                </div>

            </div>


            <!-- My Selected Path -->
            <div class="col-md-6">

                <h2 class="h4 mb-3">
                    My Selected Path
                </h2>

                <div
                    id="selected-path"
                    class="selected-path"
                >
                    <div class="empty-path">
                        <p class="text-muted mb-0">
                            Your learning path is empty.
                            Add modules from the left.
                        </p>
                    </div>
                </div>

                <button
                    id="save-path-btn"
                    class="btn btn-success w-100 mt-3"
                    type="button"
                >
                    Save Learning Path
                </button>

            </div>

        </div>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
